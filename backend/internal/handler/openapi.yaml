openapi: 3.0.3
info:
  title: EDMS API
  version: 0.1.0
  description: API for document digitization, storage, OCR processing, search, sharing, and optional signing.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: API health check
      responses:
        "200":
          description: Healthy API response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered user and token
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Auth token
  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /documents:
    get:
      tags: [Documents]
      summary: List documents
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: category_id
          description: Restrict results to a category and its subcategories
          schema:
            type: string
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"
    post:
      tags: [Documents]
      summary: Upload a document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                category_id:
                  description: Optional category to assign the document to
                  type: string
                metadata:
                  description: JSON object encoded as a string
                  type: string
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /documents/sync:
    post:
      tags: [Documents]
      summary: Reconcile files from the configured storage provider
      description: Set dry_run=true to scan and download files for comparison without creating document records, queuing OCR, or indexing.
      parameters:
        - in: query
          name: dry_run
          schema:
            type: boolean
            default: false
        - in: query
          name: workers
          schema:
            type: integer
            minimum: 1
            maximum: 16
            default: 4
      responses:
        "200":
          description: Dry run completed without side effects
        "202":
          description: Sync completed and imported documents were queued for OCR
        "400":
          description: Invalid query parameter
  /documents/{id}:
    get:
      tags: [Documents]
      summary: Get a document
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      tags: [Documents]
      summary: Delete a document
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /documents/{id}/category:
    put:
      tags: [Documents]
      summary: Set or clear a document's category
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  description: Category to assign; send an empty string to clear it
                  type: string
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Document or category not found
  /documents/{id}/download:
    get:
      tags: [Documents]
      summary: Download a document
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: File stream
  /categories:
    get:
      tags: [Categories]
      summary: List categories with their document counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
    post:
      tags: [Categories]
      summary: Create a category or subcategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid name or parent category
  /categories/{id}:
    put:
      tags: [Categories]
      summary: Update a category
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Category not found
    delete:
      tags: [Categories]
      summary: Delete an empty category
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
        "409":
          description: Category still has subcategories or documents
  /documents/{id}/sign:
    post:
      tags: [Signing]
      summary: Create a signing request when signing is enabled
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201":
          description: Signing request
        "404":
          description: Route unavailable when signing is disabled
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          example: ok
        env:
          type: string
          example: development
        features:
          type: object
          additionalProperties:
            type: boolean
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        status:
          type: string
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        parent_id:
          description: Empty for top-level categories
          type: string
        color:
          type: string
        document_count:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        parent_id:
          description: Assign to a top-level category to create a subcategory
          type: string
        color:
          type: string
    Document:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: string
        name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          format: int64
        status:
          type: string
        category:
          $ref: "#/components/schemas/Category"
