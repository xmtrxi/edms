# EDMS with its document services. SurrealDB, Redis/Valkey and Meilisearch
# are not here: point backend/.env at the ones already on the server.
#
#   cp .env.compose.example .env      # public URLs and secrets for compose
#   cp backend/.env.example backend/.env   # API settings (SurrealDB, Redis...)
#   docker compose up -d --build
#
# Services on the host itself are reachable from containers as
# host.docker.internal, e.g. SURREALDB_URL=ws://host.docker.internal:8000/rpc.

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  api:
    build:
      context: ./backend
      args:
        VERSION: ${EDMS_VERSION:-dev}
    image: edms-api:${EDMS_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      APP_PORT: "8080"
      APP_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL}
      CORS_ORIGIN: ${PUBLIC_WEB_URL}
      # Document services on the compose network.
      DOCLING_BASE_URL: http://docling:5001
      DOCLING_API_KEY: ${DOCLING_API_KEY:-}
      GOTENBERG_BASE_URL: http://gotenberg:3000
      STIRLING_PDF_URL: http://stirling-pdf:8080
      # Browsers load ONLYOFFICE from its public URL; ONLYOFFICE and the API
      # talk to each other inside the network.
      ONLYOFFICE_URL: ${PUBLIC_ONLYOFFICE_URL:?set PUBLIC_ONLYOFFICE_URL}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_API_URL: http://api:8080/api
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - edms-data:/data
    <<: *host-gateway
    depends_on:
      gotenberg:
        condition: service_started
      stirling-pdf:
        condition: service_started

  web:
    build:
      context: ./frontend
    image: edms-web:${EDMS_VERSION:-latest}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Text extraction and OCR. Models load at start, so the first boot is slow.
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    restart: unless-stopped
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:-}
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_MAX_FILE_SIZE: "104857600"
      DOCLING_SERVE_MAX_NUM_PAGES: "200"
      DOCLING_SERVE_DOCUMENT_TIMEOUT: "600"

  # Office to PDF conversion for previews, signing and PDF tools.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--api-port=3000"]

  # PDF tools. Only the API calls it, so it is not published.
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    restart: unless-stopped
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      SYSTEM_DEFAULTLOCALE: en-GB
    volumes:
      - stirling-configs:/configs

  # Editing in the browser. Browsers load it, so it is published.
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
      # Lets ONLYOFFICE fetch files from and call back to the API on the
      # private compose network.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${ONLYOFFICE_PORT:-8082}:80"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice

volumes:
  edms-data:
  stirling-configs:
  onlyoffice-data:
  onlyoffice-logs:
